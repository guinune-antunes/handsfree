# LiveKit Server Configuration
# Coloque este arquivo em /opt/livekit/livekit.yaml no servidor

port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # IMPORTANTE: Substitua pelo seu IP público
  # Para descobrir: curl -4 ifconfig.me
  node_ip: COLOQUE_SEU_IP_PUBLICO_AQUI
  use_external_ip: true

redis:
  address: redis:6379

keys:
  # IMPORTANTE: Substitua pela sua API Key e Secret
  # Gere com: openssl rand -hex 16 (key) e openssl rand -hex 32 (secret)
  # Formato: api_key: api_secret
  COLOQUE_SUA_API_KEY: COLOQUE_SEU_API_SECRET

turn:
  enabled: true
  udp_port: 3478
  # Para TURN/TLS (com domínio e SSL), descomente:
  # tls_port: 5349
  # domain: turn.seudominio.com
  # cert_file: /etc/letsencrypt/live/turn.seudominio.com/fullchain.pem
  # key_file: /etc/letsencrypt/live/turn.seudominio.com/privkey.pem
